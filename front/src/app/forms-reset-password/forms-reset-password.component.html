<div class="forms-reset-container">
    <mat-card class="forms-reset-card">
        <mat-card-header>
            <mat-card-title>Réinitialisation du mot de passe</mat-card-title>
        </mat-card-header>

        <mat-card-content>
            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Email</mat-label>
                <input matInput type="email" [(ngModel)]="emailInput">
            </mat-form-field>
        </mat-card-content>

        <mat-card-actions align="end">
            <button mat-raised-button color="primary" (click)="resetPassword()">
                Envoyer
            </button>
        </mat-card-actions>
    </mat-card>
</div>
