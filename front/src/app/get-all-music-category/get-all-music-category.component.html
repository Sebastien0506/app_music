<!---AFFICHE LES MUSIQUES D'UNE CATÉGORIE-->
<h3 class="nameCategory">
    <p>{{ nameCategory }}</p>
</h3>

<table mat-table [dataSource]="allMusic" class="mat-shadow-2">
    <ng-container matColumnDef="title">
        <th mat-header-cell *matHeaderCellDef>Titre</th>
        <td mat-cell *matCellDef="let music">{{music.title}}</td>
    </ng-container>
    <ng-container matColumnDef="duration">
        <th mat-header-cell *matHeaderCellDef>Durée</th>
        <td mat-cell *matCellDef="let music">{{ formatDuration(music.duration)}}</td>
    </ng-container>
    <ng-container matColumnDef="size">
        <th mat-header-cell *matHeaderCellDef>Taille du fichier</th>
        <td mat-cell *matCellDef="let music">{{ formatSize(music.size) }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let music">
            <audio #audioOption [src]="'http://localhost:8000' + music.file">

            </audio>
            <button mat-button (click)="viewMusic(music.id)">Afficher musique</button>
            @if(playingMusicId() === music.id){
                <button mat-button (click)="stopAudioMusic(audioOption)">Stopper la musique</button>
            } @else {
                <button mat-button (click)="playAudioMusic(audioOption, music.id)">Lire la musique</button>
            }
        </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    
</table>
