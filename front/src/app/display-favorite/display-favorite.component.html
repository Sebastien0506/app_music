<!-- On affiche les musiques favorites de l'utilisateur -->

<table mat-table [dataSource]="musicFavorite" class="mat-shadow-2">
    <ng-container matColumnDef="title">
        <th mat-header-cell *matHeaderCellDef>Titre</th>
        <td mat-cell *matCellDef="let music">{{music.title}}</td>
    </ng-container>

    <ng-container matColumnDef="category">
        <th mat-header-cell *matHeaderCellDef>Catégorie</th>
        <td mat-cell *matCellDef="let music">{{music.category}}</td>
    </ng-container>

    <ng-container matColumnDef="duration">
        <th mat-header-cell *matHeaderCellDef> Durée</th>
        <td mat-cell *matCellDef="let music">{{minutes}} min : {{secondes}} sec</td>
    </ng-container>

    <ng-container matColumnDef="size">
        <th mat-header-cell *matHeaderCellDef> Taille du fichier</th>
        <td mat-cell *matCellDef="let music">{{size}}Mo</td>
    </ng-container>

    <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <audio #audioOption [src]="'http://localhost:8000' + musicFile">

        </audio>
            <td mat-cell *matCellDef="let music">
                @if(playMusic()){
                    <button mat-button (click)="onPauseMusic()">Stopper la musique</button>
                } @else {
                   <button mat-button (click)="onPlayMusic()">Lire la musique</button>
                }
                
                <button mat-button>Télécharger la musique</button>
                <!-- <button mat-button (click)="deleteMusic(music.id)">Supprimer</button> -->
                
            </td>
        
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
