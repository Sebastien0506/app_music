
  <div class="favorite-page">

    <div class="music-grid">
  
      @for(music of musicFavorite; track music.id){
  
        <mat-card class="music-card">
  
          <!-- Image -->
          <div class="music-image">
  
            @if(music.image_file){
              <img
                [src]="'http://localhost:8000' + music.image_file"
                [alt]="music.title"
              >
            } @else {
              <mat-icon>music_note</mat-icon>
            }
  
          </div>
  
          <!-- Informations -->
          <mat-card-content class="music-content">
  
            <h2 class="music-title">
              {{music.title}}
            </h2>
  
            <div class="music-categories">
              @for(category of music.category; track category.id){
                <span class="category">
                  {{category.name}}
                </span>
              }
            </div>
  
            <!-- Favoris -->
            <button
              mat-icon-button
              class="favorite-button"
              (click)="deleteMusicFavorites(music.id)"
              aria-label="Retirer des favoris"
            >
              <mat-icon>favorite</mat-icon>
            </button>
  
          </mat-card-content>
  
          <!-- Audio -->
          <audio
            #audioOption
            [src]="'http://localhost:8000' + music.file">
          </audio>
  
          <!-- Actions -->
          <mat-card-actions class="actions">
  
            @if(playingMusicId() === music.id){
  
              <button
                mat-flat-button
                (click)="stopAudioMusic(audioOption)"
              >
                <mat-icon>stop</mat-icon>
                Stopper
              </button>
  
            } @else {
  
              <button
                mat-flat-button
                (click)="playAudioMusic(audioOption, music.id)"
              >
                <mat-icon>play_arrow</mat-icon>
                Écouter
              </button>
  
            }
  
            <button
              mat-stroked-button
              (click)="downloadMusic(music.id)"
            >
              <mat-icon>download</mat-icon>
              Télécharger
            </button>
  
          </mat-card-actions>
  
        </mat-card>
  
      }
  
    </div>
  
  </div>
