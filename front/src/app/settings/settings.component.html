<div>
    @if(isStaff()){
        <mat-list>
            <mat-list-item><button mat-button (click)="openDialog()">Ajoutez un avatar pour le site</button></mat-list-item>
            <mat-list-item><button mat-button (click)="openDialogDescription()">Ajouter une description et des liens</button></mat-list-item>
        </mat-list>
    }
    <p><mat-slide-toggle [checked]="themeService.isDarkMode()" (change)="themeService.setDarkMode($event.checked)">Mode sombre</mat-slide-toggle></p>
    
</div>
