<input #fileInput type="file" accept="image/*" hidden (change)="onFileSelected($event)">

<button mat-raised-button type="button" (click)="fileInput.click()">Choisir un avatar</button>

<button mat-button (click)="sendRequest()">Enregistrez</button>

   <p>{{selectedFile.name}}</p>
}
