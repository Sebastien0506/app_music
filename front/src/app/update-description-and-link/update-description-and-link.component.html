<div class="update_form">
    <div class="card">

        <form [formGroup]="websiteForm" (ngSubmit)="checkDescription()">

            <div class="input_update">

                <mat-form-field>
                    <mat-label>Description</mat-label>

                    <textarea
                        matInput
                        formControlName="description">
                    </textarea>
                </mat-form-field>

                @for (links of allLink(); track links.name) {
                    <mat-form-field>
                        <mat-label>{{ links.name }}</mat-label>

                        <input
                            matInput
                            type="text"
                            [formControlName]="links.name">
                    </mat-form-field>
                }
                <button mat-raised-button (click)="sendRequest()">test</button>
                <button mat-raised-button type="submit">
                    Enregistrer
                </button>

            </div>

        </form>

    </div>
</div>
