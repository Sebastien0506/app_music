<p>{{data.dataMusic.title}}</p>
<mat-form-field>
    <mat-label>Titre</mat-label>
    <input matInput type="text" [value]="data.dataMusic.title" [(ngModel)]="titleInput">
</mat-form-field>
<div class="form-check">
    
      @for(category of allCategory; track category.id){
        <div>
            <input class="form-check-input" type="checkbox" [value]="category.id" id="checkDefault">
            <label class="form-check-label" for="checkDefault">
            {{category.name}}
            </label>
        </div>
        

      }
<button mat-button (click)="sendRequest(data.dataMusic.id)">Enregistrez</button>
</div>
