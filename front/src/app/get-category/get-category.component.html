<button mat-button (click)="openForms()">Créer une nouvel catégorie</button>

<!-- @for (category of categories; track category.id) {
    <p>{{ category.name}}</p>
} -->

<table mat-table [dataSource]="category">
    <ng-container matColumnDef="category_name">
        <th mat-header-cell *matHeaderCellDef> Name</th>
        <td mat-cell *matCellDef="let category">{{ category.name }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
         <th mat-header-cell *matHeaderCellDef>Actions</th>
         <td mat-cell *matCellDef="let category">
            <button mat-button (click)="viewAllMusicCategory(category.id)">
                Voir les musiques
            </button>
            <button mat-button (click)="deleteCategory(category.id)">
                Supprimer
            </button>
         </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
