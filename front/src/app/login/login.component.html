
<ng-container>
    <mat-dialog-content>
        <mat-form-field>
            <mat-label>Email</mat-label>
            <input matInput type="text" [(ngModel)]="emailInput">
        </mat-form-field>
        <mat-form-field>
            <mat-label>Password</mat-label>
            <input matInput type="password" [(ngModel)]="passwordInput">
        </mat-form-field>
    </mat-dialog-content>
    <button (click)="verifyInput()">Se connecter</button>
</ng-container>
