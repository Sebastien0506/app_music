events {  }

http { 
    include /etc/nginx/mime.types;
    server { 
        listen 80;
        client_max_body_size 20M;

        location /api/{
            proxy_set_header Host $host;
            proxy_pass http://back:8000;
        }

        location /media/ {
            alias /app/media/;
        }

        location / {
            proxy_set_header Host $host;
            proxy_pass http://front:4200;
        }
        location /protected-media/ {
            internal;
            alias /app/media/;
        }


     }
 }