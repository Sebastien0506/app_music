events {  }

http { 
    server { 
        listen 80;
        client_max_body_size 20M;

        location /api/{
            proxy_set_header Host $host;
            proxy_pass http://back:8000;
        }

        location / {
            proxy_set_header Host $host;
            proxy_pass http://front:4200;
        }
     }
 }